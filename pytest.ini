[pytest]
addopts = -ra

# Suppress known upstream deprecation warnings (python-jose, passlib, starlette)
# so the test output stays clean. Our own code does not trip these.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    ignore:'crypt' is deprecated and slated for removal:DeprecationWarning